<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">AI 训练伙伴产品架构流程图</title>
<desc id="desc">上方为用户输入、模型宿主、常驻训练伙伴 Agent 和个人画像；中间依次是数据与外部生态、产品工具、执行循环、技能与规则、用户成长与决策五栏；下方是任务完成判断和输出。画像供 Agent 读取，执行循环进入任务判断，未完成返回循环。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#242424" stroke-width="1.6" stroke-linejoin="round"/></marker>
<marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#743e9d" stroke-width="1.6" stroke-linejoin="round"/></marker>
<style>
text { font-family:"HanziPen SC","Kaiti SC","PingFang SC",sans-serif; fill:#202020 }
.title { font-size:54px; font-weight:700; fill:#c51f20 }
.subtitle { font-size:28px; font-weight:700; fill:#126246 }
.heading { font-size:27px; font-weight:700 }
.body { font-size:19px; font-weight:600 }
.small { font-size:16px }
.orange { fill:#b45d0b }.purple { fill:#743e9d }.blue { fill:#176fc4 }.red { fill:#b02b20 }.green { fill:#167e52 }
.panel-orange { fill:#fff; stroke:#bd690e; stroke-width:3; stroke-dasharray:10 6; rx:9 }
.panel-purple { fill:#fff; stroke:#743e9d; stroke-width:3; stroke-dasharray:9 6; rx:9 }
.panel-blue { fill:#f9fcff; stroke:#176fc4; stroke-width:3.5; stroke-dasharray:10 6; rx:9 }
.box { fill:#fff; stroke:#242424; stroke-width:2.5; rx:5 }
.orange-box { fill:#fff; stroke:#d76d0d; stroke-width:2.5; rx:5 }
.green-box { fill:#fff; stroke:#167e52; stroke-width:3; rx:5 }
.output-box { fill:#fff; stroke:#d22b23; stroke-width:2.5; rx:5 }
.flow { fill:none; stroke:#242424; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow) }
.purple-flow { fill:none; stroke:#743e9d; stroke-width:2.4; stroke-dasharray:8 6; stroke-linejoin:round; marker-end:url(#purple-arrow) }
</style></defs>
