<body><h1>Trimate：从这里开始</h1><p>把收到的 ZIP 完整解压后，按电脑系统选择一个安装入口。首次安装需要联网。安装过程中可以跳过设备连接。</p>
<section><h2>Windows</h2><p>打开 <strong>Windows</strong> 文件夹，双击 <code>Install-Windows.cmd</code>。</p></section>
<section><h2>Mac</h2><p>打开 <strong>macOS</strong> 文件夹，双击 <code>安装Trimate.command</code>。若系统首次阻止打开，确认文件来源后右键选择“打开”。</p></section>
<p>安装完成后会自动打开 WorkBuddy 后续步骤。想先了解完整流程，可读<a href="使用说明.html">《Trimate使用说明》</a>。朋友无需向发送者索取账号、密码或密钥。</p>
